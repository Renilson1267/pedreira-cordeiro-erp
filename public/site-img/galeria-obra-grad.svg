<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A2540" />
      <stop offset="60%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)" />

  <!-- Motor Grader / Earthmoving Graphic -->
  <g transform="translate(600, 310)">
    <circle cx="0" cy="0" r="110" fill="#0A2540" stroke="#F59E0B" stroke-width="3" />
    <!-- Ground line -->
    <line x1="-70" y1="45" x2="70" y2="45" stroke="#94A3B8" stroke-width="4" />
    <!-- Blade -->
    <path d="M -30 40 L 30 30" stroke="#F59E0B" stroke-width="6" stroke-linecap="round" />
    <!-- Grader Body -->
    <rect x="-40" y="5" width="80" height="15" rx="3" fill="#F59E0B" />
    <circle cx="-35" cy="35" r="12" fill="#0F172A" stroke="#CBD5E1" stroke-width="3" />
    <circle cx="35" cy="35" r="12" fill="#0F172A" stroke="#CBD5E1" stroke-width="3" />
    <path d="M -15 5 L 0 -20 L 15 5 Z" fill="#2563EB" />
  </g>

  <g transform="translate(600, 110)">
    <rect x="-170" y="-20" width="340" height="40" rx="20" fill="#0A2540" stroke="#F59E0B" stroke-width="1.5" />
    <circle cx="-145" cy="0" r="6" fill="#F59E0B" />
    <text x="0" y="6" fill="#FDE68A" font-family="system-ui, sans-serif" font-size="13" font-weight="800" letter-spacing="2" text-anchor="middle">TERRAPLANAGEM &amp; BASE</text>
  </g>

  <text x="600" y="475" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="34" font-weight="900" text-anchor="middle">
    Preparação de Obra
  </text>
  <text x="600" y="508" fill="#FDE68A" font-family="system-ui, sans-serif" font-size="16" font-weight="500" text-anchor="middle">
    Nivelamento com Motoniveladora e Preparação de Terreno
  </text>

  <rect x="0" y="788" width="1200" height="12" fill="#F59E0B" />
</svg>
