<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A2540" />
      <stop offset="60%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)" />

  <g transform="translate(600, 310)">
    <circle cx="0" cy="0" r="110" fill="#0A2540" stroke="#F59E0B" stroke-width="3" />
    <!-- Trowel / Polishing machine vector (Helicóptero de piso) -->
    <circle cx="0" cy="20" r="45" fill="none" stroke="#F59E0B" stroke-width="3" />
    <line x1="-40" y1="20" x2="40" y2="20" stroke="#CBD5E1" stroke-width="4" />
    <line x1="0" y1="-20" x2="0" y2="60" stroke="#CBD5E1" stroke-width="4" />
    <circle cx="0" cy="20" r="12" fill="#E2E8F0" />
    <line x1="0" y1="20" x2="-25" y2="-45" stroke="#94A3B8" stroke-width="5" stroke-linecap="round" />
  </g>

  <g transform="translate(600, 110)">
    <rect x="-160" y="-20" width="320" height="40" rx="20" fill="#0A2540" stroke="#F59E0B" stroke-width="1.5" />
    <circle cx="-135" cy="0" r="6" fill="#F59E0B" />
    <text x="0" y="6" fill="#FDE68A" font-family="system-ui, sans-serif" font-size="13" font-weight="800" letter-spacing="2" text-anchor="middle">ACABAMENTO DE PISO</text>
  </g>

  <text x="600" y="475" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="34" font-weight="900" text-anchor="middle">
    Acabamento e Cura do Piso
  </text>
  <text x="600" y="508" fill="#FDE68A" font-family="system-ui, sans-serif" font-size="16" font-weight="500" text-anchor="middle">
    Polimento Mecânico e Controle de Cura do Concreto Usinado
  </text>

  <rect x="0" y="788" width="1200" height="12" fill="#F59E0B" />
</svg>
