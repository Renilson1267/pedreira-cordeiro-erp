<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A2540" />
      <stop offset="60%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="silo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CBD5E1" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)" />

  <!-- Silo Towers Graphic -->
  <g transform="translate(600, 300)">
    <circle cx="0" cy="0" r="110" fill="#0A2540" stroke="#38BDF8" stroke-width="3" />
    <!-- Silo 1 -->
    <rect x="-45" y="-50" width="35" height="75" rx="4" fill="url(#silo)" stroke="#1E293B" stroke-width="2" />
    <path d="M -45 -50 Q -27 -65 -10 -50 Z" fill="#2563EB" />
    <polygon points="-45,25 -28,50 -10,25" fill="#64748B" />
    <!-- Silo 2 -->
    <rect x="10" y="-50" width="35" height="75" rx="4" fill="url(#silo)" stroke="#1E293B" stroke-width="2" />
    <path d="M 10 -50 Q 27 -65 45 -50 Z" fill="#2563EB" />
    <polygon points="10,25 27,50 45,25" fill="#64748B" />
    <!-- Legs -->
    <line x1="-40" y1="25" x2="-40" y2="60" stroke="#64748B" stroke-width="3" />
    <line x1="-15" y1="25" x2="-15" y2="60" stroke="#64748B" stroke-width="3" />
    <line x1="15" y1="25" x2="15" y2="60" stroke="#64748B" stroke-width="3" />
    <line x1="40" y1="25" x2="40" y2="60" stroke="#64748B" stroke-width="3" />
  </g>

  <g transform="translate(600, 110)">
    <rect x="-180" y="-20" width="360" height="40" rx="20" fill="#0A2540" stroke="#38BDF8" stroke-width="1.5" />
    <circle cx="-155" cy="0" r="6" fill="#38BDF8" />
    <text x="0" y="6" fill="#BAE6FD" font-family="system-ui, sans-serif" font-size="13" font-weight="800" letter-spacing="2" text-anchor="middle">CENTRAL DOSADORA</text>
  </g>

  <text x="600" y="475" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="34" font-weight="900" text-anchor="middle">
    Silo de Concreto GC Mix
  </text>
  <text x="600" y="508" fill="#BAE6FD" font-family="system-ui, sans-serif" font-size="16" font-weight="500" text-anchor="middle">
    Armazenagem de Cimento e Central de Alta Capacidade
  </text>

  <rect x="0" y="788" width="1200" height="12" fill="#38BDF8" />
</svg>
