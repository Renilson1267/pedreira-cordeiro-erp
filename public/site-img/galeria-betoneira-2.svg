<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A2540" />
      <stop offset="60%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0D1F38" />
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)" />

  <g transform="translate(600, 310)">
    <circle cx="0" cy="0" r="110" fill="#0A2540" stroke="#38BDF8" stroke-width="3" />
    <!-- Betoneira carregando na pedreira -->
    <rect x="-65" y="30" width="130" height="10" rx="3" fill="#E2E8F0" />
    <circle cx="-45" cy="42" r="13" fill="#0F172A" stroke="#CBD5E1" stroke-width="3" />
    <circle cx="-18" cy="42" r="13" fill="#0F172A" stroke="#CBD5E1" stroke-width="3" />
    <circle cx="45" cy="42" r="13" fill="#0F172A" stroke="#CBD5E1" stroke-width="3" />
    <path d="M 28 0 L 50 0 Q 65 15 67 30 L 28 30 Z" fill="#2563EB" stroke="#FFFFFF" stroke-width="1.5" />
    <ellipse cx="-15" cy="2" rx="40" ry="22" transform="rotate(-18 -15 2)" fill="#FFFFFF" stroke="#1E3A8A" stroke-width="2" />
    <!-- Silo discharge overhead -->
    <path d="M -30 -70 L 0 -70 L -10 -40 L -20 -40 Z" fill="#F59E0B" />
    <line x1="-15" y1="-40" x2="-15" y2="-20" stroke="#F59E0B" stroke-width="3" stroke-dasharray="2 4" />
  </g>

  <g transform="translate(600, 110)">
    <rect x="-180" y="-20" width="360" height="40" rx="20" fill="#0A2540" stroke="#38BDF8" stroke-width="1.5" />
    <circle cx="-155" cy="0" r="6" fill="#38BDF8" />
    <text x="0" y="6" fill="#BAE6FD" font-family="system-ui, sans-serif" font-size="13" font-weight="800" letter-spacing="2" text-anchor="middle">OPERAÇÃO INTEGRADA</text>
  </g>

  <text x="600" y="475" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="34" font-weight="900" text-anchor="middle">
    Betoneira GC Mix &amp; Pedreira Cordeiro
  </text>
  <text x="600" y="508" fill="#93C5FD" font-family="system-ui, sans-serif" font-size="16" font-weight="500" text-anchor="middle">
    Carregamento Direto no Pátio de Agregados
  </text>

  <rect x="0" y="788" width="1200" height="12" fill="#38BDF8" />
</svg>
