<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A2540" />
      <stop offset="60%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#1E40AF" />
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)" />

  <!-- Road / Highway Graphic -->
  <g transform="translate(600, 310)">
    <circle cx="0" cy="0" r="110" fill="#0A2540" stroke="#3B82F6" stroke-width="3" />
    <!-- Curved road -->
    <path d="M -70 50 Q 0 -30 70 -50" stroke="#475569" stroke-width="32" fill="none" stroke-linecap="round" />
    <path d="M -70 50 Q 0 -30 70 -50" stroke="#F59E0B" stroke-width="3" fill="none" stroke-dasharray="10 8" />
    <!-- Truck moving on road -->
    <circle cx="0" cy="-6" r="14" fill="#2563EB" stroke="#FFFFFF" stroke-width="2" />
  </g>

  <g transform="translate(600, 110)">
    <rect x="-140" y="-20" width="280" height="40" rx="20" fill="#0A2540" stroke="#38BDF8" stroke-width="1.5" />
    <circle cx="-115" cy="0" r="6" fill="#38BDF8" />
    <text x="0" y="6" fill="#BAE6FD" font-family="system-ui, sans-serif" font-size="13" font-weight="800" letter-spacing="2" text-anchor="middle">LOGÍSTICA ÁGIL</text>
  </g>

  <text x="600" y="475" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="34" font-weight="900" text-anchor="middle">
    Betoneira em Rota
  </text>
  <text x="600" y="508" fill="#93C5FD" font-family="system-ui, sans-serif" font-size="16" font-weight="500" text-anchor="middle">
    Pontualidade na Entrega no Interior da PB, PE e RN
  </text>

  <rect x="0" y="788" width="1200" height="12" fill="#38BDF8" />
</svg>
