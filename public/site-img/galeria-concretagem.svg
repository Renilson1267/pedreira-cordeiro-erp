<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A2540" />
      <stop offset="60%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0E1E3D" />
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)" />

  <!-- Slab pouring / concrete pump graphic -->
  <g transform="translate(600, 310)">
    <circle cx="0" cy="0" r="110" fill="#0A2540" stroke="#3B82F6" stroke-width="3" />
    <!-- Slab grid -->
    <rect x="-70" y="20" width="140" height="25" fill="#475569" stroke="#94A3B8" stroke-width="2" />
    <!-- Pump boom pipe -->
    <path d="M -50 -50 L 0 -15 L 20 20" stroke="#EF4444" stroke-width="8" fill="none" stroke-linecap="round" />
    <circle cx="20" cy="22" r="10" fill="#94A3B8" />
  </g>

  <g transform="translate(600, 110)">
    <rect x="-160" y="-20" width="320" height="40" rx="20" fill="#0A2540" stroke="#3B82F6" stroke-width="1.5" />
    <circle cx="-135" cy="0" r="6" fill="#10B981" />
    <text x="0" y="6" fill="#93C5FD" font-family="system-ui, sans-serif" font-size="13" font-weight="800" letter-spacing="2" text-anchor="middle">CONCRETAGEM REAL</text>
  </g>

  <text x="600" y="475" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="34" font-weight="900" text-anchor="middle">
    Concretagem em Patos — PB
  </text>
  <text x="600" y="508" fill="#93C5FD" font-family="system-ui, sans-serif" font-size="16" font-weight="500" text-anchor="middle">
    Despejo Contínuo em Laje e Fundação Estrutural
  </text>

  <rect x="0" y="788" width="1200" height="12" fill="#3B82F6" />
</svg>
