<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A2540" />
      <stop offset="60%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#1E40AF" />
    </linearGradient>
    <linearGradient id="drum" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#93C5FD" />
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)" />

  <!-- Truck Silhouette Artwork -->
  <g transform="translate(600, 310)">
    <circle cx="0" cy="0" r="110" fill="#0A2540" stroke="#3B82F6" stroke-width="3" />
    <!-- Concrete Mixer Truck Vector -->
    <!-- Chassis -->
    <rect x="-70" y="30" width="140" height="10" rx="3" fill="#E2E8F0" />
    <!-- Wheels -->
    <circle cx="-50" cy="42" r="14" fill="#0F172A" stroke="#CBD5E1" stroke-width="4" />
    <circle cx="-20" cy="42" r="14" fill="#0F172A" stroke="#CBD5E1" stroke-width="4" />
    <circle cx="50" cy="42" r="14" fill="#0F172A" stroke="#CBD5E1" stroke-width="4" />
    <!-- Cabin -->
    <path d="M 30 0 L 55 0 Q 70 15 72 30 L 30 30 Z" fill="#2563EB" stroke="#FFFFFF" stroke-width="1.5" />
    <!-- Window -->
    <path d="M 36 6 L 50 6 Q 60 14 62 20 L 36 20 Z" fill="#93C5FD" />
    <!-- Mixer Drum -->
    <ellipse cx="-15" cy="0" rx="42" ry="24" transform="rotate(-18 -15 0)" fill="url(#drum)" stroke="#1E3A8A" stroke-width="2" />
    <!-- Drum Stripe GC MIX -->
    <path d="M -40 -10 Q -15 0 10 10" stroke="#1E3A8A" stroke-width="4" fill="none" />
    <!-- Chute -->
    <path d="M -60 -5 L -75 10 L -70 12 L -55 -3 Z" fill="#F59E0B" />
  </g>

  <g transform="translate(600, 110)">
    <rect x="-170" y="-20" width="340" height="40" rx="20" fill="#0A2540" stroke="#60A5FA" stroke-width="1.5" />
    <circle cx="-145" cy="0" r="6" fill="#10B981" />
    <text x="0" y="6" fill="#93C5FD" font-family="system-ui, sans-serif" font-size="13" font-weight="800" letter-spacing="2" text-anchor="middle">FROTA PRÓPRIA GC MIX</text>
  </g>

  <text x="600" y="475" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="34" font-weight="900" text-anchor="middle">
    Betoneira GC Mix em Entrega
  </text>
  <text x="600" y="508" fill="#93C5FD" font-family="system-ui, sans-serif" font-size="16" font-weight="500" text-anchor="middle">
    Caminhão Betoneira Atendendo Obras na Paraíba
  </text>

  <rect x="0" y="788" width="1200" height="12" fill="#3B82F6" />
</svg>
