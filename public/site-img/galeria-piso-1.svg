<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A2540" />
      <stop offset="60%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)" />

  <g transform="translate(600, 310)">
    <circle cx="0" cy="0" r="110" fill="#0A2540" stroke="#38BDF8" stroke-width="3" />
    <!-- Polished industrial floor perspective grid -->
    <polygon points="-70,40 70,40 45,0 -45,0" fill="#334155" stroke="#38BDF8" stroke-width="1.5" />
    <!-- Shine reflection lines -->
    <line x1="-30" y1="10" x2="-10" y2="30" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.8" />
    <line x1="10" y1="10" x2="30" y2="30" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.8" />
  </g>

  <g transform="translate(600, 110)">
    <rect x="-160" y="-20" width="320" height="40" rx="20" fill="#0A2540" stroke="#38BDF8" stroke-width="1.5" />
    <circle cx="-135" cy="0" r="6" fill="#38BDF8" />
    <text x="0" y="6" fill="#BAE6FD" font-family="system-ui, sans-serif" font-size="13" font-weight="800" letter-spacing="2" text-anchor="middle">PISO INDUSTRIAL</text>
  </g>

  <text x="600" y="475" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="34" font-weight="900" text-anchor="middle">
    Piso de Concreto Industrial
  </text>
  <text x="600" y="508" fill="#BAE6FD" font-family="system-ui, sans-serif" font-size="16" font-weight="500" text-anchor="middle">
    Resistência Calculada, Nivelamento a Laser e Alta Durabilidade
  </text>

  <rect x="0" y="788" width="1200" height="12" fill="#38BDF8" />
</svg>
