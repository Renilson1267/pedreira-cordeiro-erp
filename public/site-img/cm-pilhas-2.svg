<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A2540" />
      <stop offset="50%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="gravel2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)" />

  <g transform="translate(600, 310)">
    <circle cx="0" cy="0" r="110" fill="#0A2540" stroke="#38BDF8" stroke-width="3" />
    <!-- Stockpile layers -->
    <polygon points="-85,55 -20,-30 45,55" fill="url(#gravel2)" stroke="#94A3B8" stroke-width="2" />
    <polygon points="-10,55 50,-15 95,55" fill="#475569" stroke="#64748B" stroke-width="2" />
    <polygon points="-60,55 0,5 60,55" fill="#334155" opacity="0.8" />
  </g>

  <g transform="translate(600, 110)">
    <rect x="-180" y="-20" width="360" height="40" rx="20" fill="#0A2540" stroke="#38BDF8" stroke-width="1.5" />
    <circle cx="-155" cy="0" r="6" fill="#38BDF8" />
    <text x="0" y="6" fill="#BAE6FD" font-family="system-ui, sans-serif" font-size="13" font-weight="800" letter-spacing="2" text-anchor="middle">ESTOQUE DE AGREGADOS</text>
  </g>

  <text x="600" y="475" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="34" font-weight="900" text-anchor="middle">
    Pilha de Brita Uniforme
  </text>
  <text x="600" y="508" fill="#BAE6FD" font-family="system-ui, sans-serif" font-size="16" font-weight="500" text-anchor="middle">
    Produção Contínua e Rigoroso Controle Granulométrico
  </text>

  <rect x="0" y="788" width="1200" height="12" fill="#38BDF8" />
</svg>
