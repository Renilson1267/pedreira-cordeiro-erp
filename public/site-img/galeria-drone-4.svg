    <!-- Pin & Radius circles -->
    <circle cx="0" cy="0" r="60" fill="none" stroke="#60A5FA" stroke-width="1.5" stroke-dasharray="4 4" />
    <path d="M 0 -35 C -15 -35 -25 -25 -25 -10 C -25 15 0 35 0 35 C 0 35 25 15 25 -10 C 25 -25 15 -35 0 -35 Z" fill="#EF4444" />
    <circle cx="0" cy="-15" r="8" fill="#FFFFFF" />
  </g>

  <g transform="translate(600, 110)">
    <rect x="-160" y="-20" width="320" height="40" rx="20" fill="#0A2540" stroke="#38BDF8" stroke-width="1.5" />
    <circle cx="-135" cy="0" r="6" fill="#38BDF8" />
    <text x="0" y="6" fill="#BAE6FD" font-family="system-ui, sans-serif" font-size="13" font-weight="800" letter-spacing="2" text-anchor="middle">ATENDIMENTO REGIONAL</text>
  </g>

