<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A2540" />
      <stop offset="50%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)" />

  <!-- Fixed Crusher Plant / Installation Graphic (Not Lokotrack) -->
  <g transform="translate(600, 310)">
    <circle cx="0" cy="0" r="110" fill="#0A2540" stroke="#38BDF8" stroke-width="3" />
    <!-- Secondary crusher / screen structure -->
    <rect x="-60" y="-30" width="120" height="50" rx="4" fill="#334155" stroke="#60A5FA" stroke-width="2" />
    <!-- Belt conveyor angled -->
    <line x1="-70" y1="40" x2="-20" y2="-40" stroke="#F59E0B" stroke-width="8" stroke-linecap="round" />
    <line x1="20" y1="-40" x2="70" y2="40" stroke="#F59E0B" stroke-width="8" stroke-linecap="round" />
    <!-- Chute & Piles below -->
    <polygon points="-40,55 0,15 40,55" fill="#94A3B8" />
  </g>

  <g transform="translate(600, 110)">
    <rect x="-180" y="-20" width="360" height="40" rx="20" fill="#0A2540" stroke="#38BDF8" stroke-width="1.5" />
    <circle cx="-155" cy="0" r="6" fill="#38BDF8" />
    <text x="0" y="6" fill="#BAE6FD" font-family="system-ui, sans-serif" font-size="13" font-weight="800" letter-spacing="2" text-anchor="middle">CENTRAL DE BRITAGEM FIXA</text>
  </g>

  <text x="600" y="475" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="34" font-weight="900" text-anchor="middle">
    Instalação de Britagem
  </text>
  <text x="600" y="508" fill="#BAE6FD" font-family="system-ui, sans-serif" font-size="16" font-weight="500" text-anchor="middle">
    Britador Fixo em Atividade na Matriz — Patos-PB
  </text>

  <rect x="0" y="788" width="1200" height="12" fill="#38BDF8" />
</svg>
