<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A2540" />
      <stop offset="60%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)" />

  <!-- Industrial Crusher / Plant Icon Artwork -->
  <g transform="translate(600, 310)">
    <circle cx="0" cy="0" r="105" fill="#1E293B" stroke="#F59E0B" stroke-width="3" />
    <!-- Crusher Plant Silhouette -->
    <!-- Hopper -->
    <path d="M -60 -50 L 60 -50 L 30 0 L -30 0 Z" fill="#F59E0B" />
    <!-- Conveyor belt -->
    <rect x="-70" y="10" width="140" height="12" rx="6" fill="#94A3B8" />
    <!-- Screens / Structure -->
    <path d="M -45 22 L -70 60 M 45 22 L 70 60 M 0 22 L 0 60" stroke="#CBD5E1" stroke-width="4" />
    <!-- Piles of aggregate below -->
    <polygon points="-75,65 -50,35 -25,65" fill="#64748B" />
    <polygon points="-30,65 0,25 30,65" fill="#94A3B8" />
    <polygon points="25,65 50,35 75,65" fill="#64748B" />
  </g>

  <g transform="translate(600, 110)">
    <rect x="-180" y="-20" width="360" height="40" rx="20" fill="#0A2540" stroke="#F59E0B" stroke-width="1.5" />
    <circle cx="-155" cy="0" r="6" fill="#F59E0B" />
    <text x="0" y="6" fill="#FDE68A" font-family="system-ui, sans-serif" font-size="13" font-weight="800" letter-spacing="2" text-anchor="middle">CENTRAL DE BRITAGEM FIXA</text>
  </g>

  <text x="600" y="475" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="34" font-weight="900" text-anchor="middle">
    Britador Visto do Alto
  </text>
  <text x="600" y="508" fill="#FDE68A" font-family="system-ui, sans-serif" font-size="16" font-weight="500" text-anchor="middle">
    Instalação de Britagem e Peneiramento Contínuo em Patos-PB
  </text>

  <rect x="0" y="788" width="1200" height="12" fill="url(#amberGlow)" />
</svg>
