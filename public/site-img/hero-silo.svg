<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A2540" />
      <stop offset="60%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#081426" />
    </linearGradient>
    <linearGradient id="silo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)" />

  <g transform="translate(600, 300)">
    <circle cx="0" cy="0" r="110" fill="#0A2540" stroke="#F59E0B" stroke-width="3" />
    <!-- Giant Silo Monteiro -->
    <rect x="-30" y="-60" width="60" height="95" rx="5" fill="url(#silo)" stroke="#1E293B" stroke-width="2" />
    <path d="M -30 -60 Q 0 -80 30 -60 Z" fill="#2563EB" />
    <polygon points="-30,35 0,65 30,35" fill="#64748B" />
    <text x="0" y="-10" fill="#1E3A8A" font-family="system-ui, sans-serif" font-size="11" font-weight="900" text-anchor="middle">GC MIX</text>
  </g>

  <g transform="translate(600, 110)">
    <rect x="-170" y="-20" width="340" height="40" rx="20" fill="#0A2540" stroke="#F59E0B" stroke-width="1.5" />
    <circle cx="-145" cy="0" r="6" fill="#F59E0B" />
    <text x="0" y="6" fill="#FDE68A" font-family="system-ui, sans-serif" font-size="13" font-weight="800" letter-spacing="2" text-anchor="middle">UNIDADE MONTEIRO — PB</text>
  </g>

  <text x="600" y="475" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="34" font-weight="900" text-anchor="middle">
    Silo GC Mix — Monteiro — PB
  </text>
  <text x="600" y="508" fill="#FDE68A" font-family="system-ui, sans-serif" font-size="16" font-weight="500" text-anchor="middle">
    Central de Concreto com Atendimento Regional e 0800 083 1200
  </text>

  <rect x="0" y="788" width="1200" height="12" fill="#F59E0B" />
</svg>
