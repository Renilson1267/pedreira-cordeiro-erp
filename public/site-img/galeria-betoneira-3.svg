<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A2540" />
      <stop offset="50%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0B1528" />
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)" />

  <!-- Fleet of 3 trucks aligned -->
  <g transform="translate(600, 310)">
    <circle cx="0" cy="0" r="110" fill="#0A2540" stroke="#F59E0B" stroke-width="3" />
    <!-- Center truck -->
    <rect x="-50" y="20" width="100" height="8" rx="2" fill="#E2E8F0" />
    <circle cx="-35" cy="30" r="10" fill="#0F172A" stroke="#CBD5E1" stroke-width="2" />
    <circle cx="35" cy="30" r="10" fill="#0F172A" stroke="#CBD5E1" stroke-width="2" />
    <ellipse cx="-10" cy="5" rx="30" ry="16" transform="rotate(-15 -10 5)" fill="#FFFFFF" stroke="#1E3A8A" stroke-width="2" />
    <path d="M 22 2 L 38 2 Q 48 10 50 20 L 22 20 Z" fill="#2563EB" />
    <!-- Rear truck 1 -->
    <ellipse cx="-35" cy="-25" rx="22" ry="12" transform="rotate(-15 -35 -25)" fill="#93C5FD" opacity="0.7" />
    <!-- Rear truck 2 -->
    <ellipse cx="25" cy="-25" rx="22" ry="12" transform="rotate(-15 25 -25)" fill="#93C5FD" opacity="0.7" />
  </g>

  <g transform="translate(600, 110)">
    <rect x="-160" y="-20" width="320" height="40" rx="20" fill="#0A2540" stroke="#F59E0B" stroke-width="1.5" />
    <circle cx="-135" cy="0" r="6" fill="#F59E0B" />
    <text x="0" y="6" fill="#FDE68A" font-family="system-ui, sans-serif" font-size="13" font-weight="800" letter-spacing="2" text-anchor="middle">FROTA INTEGRADA</text>
  </g>

  <text x="600" y="475" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="34" font-weight="900" text-anchor="middle">
    Frota de Betoneiras GC Mix
  </text>
  <text x="600" y="508" fill="#FDE68A" font-family="system-ui, sans-serif" font-size="16" font-weight="500" text-anchor="middle">
    Caminhões Traçados para Entregas Volumosas e Contínuas
  </text>

  <rect x="0" y="788" width="1200" height="12" fill="#F59E0B" />
</svg>
